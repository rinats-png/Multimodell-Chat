name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:

# Minimale Rechte (Regel 9.6)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Tests, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Build ohne echte Schlüssel; Produktionsprüfung erlaubt hier nur den Demo-Workspace.
          ALLOW_DEMO_MODE: "true"
      # Bekannte, bewertete Restbefunde stehen in docs/idea-to-app/ENTSCHEIDUNGEN.md (E-005);
      # neue kritische Schwachstellen brechen den Lauf ab.
      - run: npm audit --omit=dev --audit-level=critical

  rls:
    name: RLS- und Rechte-Tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rls_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y --no-install-recommends postgresql-client
      - run: bash scripts/test-rls.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rls_test

  secrets:
    name: Secret-Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
